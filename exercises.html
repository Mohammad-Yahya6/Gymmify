<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gymmify - Your All-in-One Fitness App</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="exercises.css" />
    <script src="script.js" defer></script>
    <script src="exercises.js" defer></script>
</head>

<body>
    <header>
        <div class="logo">
            <a href="index.html">Gymmify</a>
        </div>
        
        <button class="menu-toggle" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="#">About ▼</a></li>
                <li><a href="bodymap.html">Body Map</a></li>
                <li><a href="#">Nutrition</a></li>
                <li><a href="exercises.html">Exercise</a></li>
            </ul>
        </nav>
        
        <div class="icons">
            <img src="/images/brightness.png" alt="Theme toggle" aria-label="Toggle theme">
            <img src="/images/pfp.png" alt="User profile" aria-label="User profile">
        </div>
    </header>


    <main class="exercises-main">
        <section class="search-section">
            <div class="search-container">
                <input type="text" 
                       id="search-input" 
                       class="search-input" 
                       placeholder="Search exercises..." 
                       aria-label="Search exercises">
                <button class="search-btn">Search</button>
            </div>
        </section>

        <section class="filters-section">
            <div class="filter-group">
                <label for="body-focus">Body Focus</label>
                <select id="body-focus" class="filter-select">
                    <option value="all">All Parts</option>
                    <option value="upper">Upper</option>
                    <option value="lower">Lower</option>
                    <option value="full">Full Body</option>

                </select>
            </div>

            <div class="filter-group">
                <label for="exact-part">Exact Part</label>
                <select id="exact-part" class="filter-select">
                    <option value="all">All Muscle Groups</option>
                    <option value="chest">Chest</option>
                    <option value="shoulders">Shoulders</option>
                    <option value="biceps">Biceps</option>
                    <option value="triceps">Triceps</option>
                    <option value="abs">Abs</option>
                    <option value="quadriceps">Quadriceps</option>
                    <option value="hamstrings">Hamstrings</option>
                    <option value="calves">Calves</option>
                    <option value="traps">Traps</option>
                    <option value="lats">Lats</option>
                    <option value="lower-back">Lower Back</option>
                    <option value="glutes">Glutes</option>
                </select>
            </div>


            <div class="filter-group">
                <label for="equipment">Equipment</label>
                <select id="equipment" class="filter-select">
                    <option value="all">All Equipment</option>
                    <option value="barbell">Barbell</option>
                    <option value="dumbbell">Dumbbell</option>
                    <option value="cable">Cable</option>
                    <option value="machine">Machine</option>
                    <option value="bodyweight">Bodyweight</option>
                </select>
            </div>

        </section>

        <section class="results-section">
            <div class="results-header">
                <h2 id="results-count">All Exercises</h2>
                <div class="view-toggle">
                    <button class="view-btn active" data-view="grid">
                        <span>⊞</span> Grid
                    </button>
                    <button class="view-btn" data-view="list">
                        <span>☰</span> List
                    </button>
                </div>
            </div>

            <div class="exercises-grid" id="exercises-container">
                <!-- Exercise cards will be dynamically generated here -->
            </div>

            <div class="no-results" id="no-results" style="display: none;">
                <h3>No exercises found</h3>
                <p>Try adjusting your filters or search terms</p>
            </div>
        </section>
    </main>
    <footer>
        <div class="footer-top">
            <div class="footer-left">
                <div class="brand-row">
                    <h2>Gymmify</h2>
                </div>
                <nav class="top-links">
                    <a href="#">Home</a>
                    <a href="#">Body Map</a>
                    <a href="#">Meal Plans</a>
                    <a href="#">About</a>
                    <a href="#">Nutrition</a>
                </nav>
            </div>

            <div class="footer-right">
                <h3>Follow Us</h3>
                <div class="social-icons">
                    <a href="#" aria-label="Instagram">
                        <img src="/images/instablack.png" alt="Instagram">
                    </a>
                    <a href="#" aria-label="Twitter">
                        <img src="/images/twitterblack.png" alt="Twitter">
                    </a>
                    <a href="#" aria-label="TikTok">
                        <img src="/images/tiktokblack.png" alt="TikTok">
                    </a>
                    <a href="#" aria-label="Facebook">
                        <img src="/images/faceblack.png" alt="Facebook">
                    </a>
                </div>
            </div>
        </div>

        <div class="footer-bottom">
            <p>All Copyright laws reserved ©</p>
        </div>
    </footer>
</body>
</html>
